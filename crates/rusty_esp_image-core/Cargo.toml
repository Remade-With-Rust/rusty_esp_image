[package]
name = "rusty_esp_image-core"
description = "esp32-camera and esp_jpeg remade in Rust, the pure core: the ImageSource seam, a caller-owned frame pool, a JPEG header probe, pixel kernels with scalar oracles, sensor register tables as data, and SCCB register access over embedded-hal. no_std, forbid(unsafe), no drivers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rusty_esp_image-core"
keywords = ["esp32", "embedded", "no-std", "camera", "jpeg"]
categories = ["embedded", "no-std", "multimedia::images", "hardware-support"]

[features]
default = ["std"]
# The feature ladder is the rusty_zstd one: `std` implies `alloc`; with neither,
# the crate is pure `core` and still builds on riscv32 bare metal. Nothing in
# this crate needs `alloc` today; the rungs exist so consumers compose.
std = ["alloc", "rusty_esp_core/std", "rusty_esp_dsp/std"]
alloc = ["rusty_esp_core/alloc", "rusty_esp_dsp/alloc"]
# JPEG encoding on the chip through `rusty_jpeg` 0.4 (`no_std` + `alloc`):
# `jpeg::encode`. Off by default so a probe-only consumer carries no codec.
jpeg = ["alloc", "dep:rusty_jpeg"]

[dependencies]
rusty_esp_core = { workspace = true }
rusty_esp_dsp = { workspace = true }
# The I2C trait SCCB rides on. 1.0 is the stable embedded-hal; no_std.
embedded-hal = "1.0"
# The house JPEG codec with no default features (no `std`, no SIMD): the
# portable scalar build is the chip build.
rusty_jpeg = { version = "0.4", default-features = false, optional = true }

[dev-dependencies]
# Host oracle for the JPEG probe: real baseline and progressive JPEGs of known
# geometry, encoded by the house encoder.
rusty_jpeg = { version = "0.4", default-features = false, features = ["std"] }

[lints]
workspace = true
