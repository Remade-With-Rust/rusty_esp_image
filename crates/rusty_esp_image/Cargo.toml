[package]
name = "rusty_esp_image"
description = "esp32-camera / esp_jpeg remade in Rust: sensor bring-up as data, DMA frame pools, pixel ops, JPEG/PNG via rusty_jpeg and rusty_png. Memory safe, no_std core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/rusty_esp_image"
keywords = ["esp32", "embedded", "no-std", "mata", "remade-with-rust"]
categories = ["embedded", "no-std", "hardware-support"]

[features]
default = ["std"]
std = ["rusty_esp_image-core/std", "rusty_esp_image-esp/std"]
alloc = ["rusty_esp_image-core/alloc"]
# Track B: bare metal, esp-hal + Embassy.
esp-hal = ["rusty_esp_image-esp/esp-hal"]
# Track A: std on ESP-IDF via esp-idf-svc.
esp-idf = ["rusty_esp_image-esp/esp-idf"]

[dependencies]
rusty_esp_image-core = { workspace = true }
rusty_esp_image-esp = { workspace = true }

[lints]
workspace = true
