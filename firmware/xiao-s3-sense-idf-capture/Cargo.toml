# Janus I1 firmware — XIAO ESP32-S3 Sense, Track A (std on ESP-IDF):
# the camera measured against the chip's own clock, with the driver's event
# counters beside the rate, and the frame-buffer pool deliberately starved.
#
# No network: the row's numbers are the camera's, and a radio would only add
# a variable this measurement does not want. Frames reach the laptop over the
# serial link so an outside tool can still judge them.
#
# A separate cargo project on purpose (Xtensa target, ESP-IDF build, its own
# toolchain). Build from this directory. See README.md.

[package]
name = "xiao-s3-sense-idf-capture"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Janus I1: XIAO ESP32-S3 Sense camera frame rate, driver counters and pool exhaustion (ESP-IDF track)."

[[bin]]
name = "xiao-s3-sense-idf-capture"
harness = false # no cargo test harness on the chip

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true
opt-level = "z"
lto = true
codegen-units = 1

[features]
default = ["std", "esp-idf-svc/native"]
std = ["alloc", "esp-idf-svc/binstart", "esp-idf-svc/std"]
alloc = ["esp-idf-svc/alloc"]

[dependencies]
log = "0.4"
anyhow = "1"
esp-idf-svc = { version = "0.52", default-features = false }
# The camera bindings module (`esp_idf_sys::camera`) is generated from the
# extra component declared below; rusty_esp_image-esp reads it.
esp-idf-sys = "0.37"

# Janus crates. Siblings by git URL (the umbrella's .cargo/config.toml patches
# them to local checkouts); this repo's own crates by path.
rusty_esp_core = { git = "https://github.com/Remade-With-Rust/rusty_esp_core", default-features = false, features = ["std"] }
rusty_esp_image-core = { path = "../../crates/rusty_esp_image-core", default-features = false, features = ["std"] }
rusty_esp_image-esp = { path = "../../crates/rusty_esp_image-esp", default-features = false, features = ["esp-idf"] }

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]
# ESP-IDF v5.5 line, the one n0's iroh-on-ESP32 examples and esp-idf-svc 0.52 target.
esp_idf_version = "v5.5.1"
esp_idf_tools_install_dir = "global"

# Espressif's camera driver, bound once. `bindings_module = "camera"` is the
# name rusty_esp_image-esp expects.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp32-camera", version = "^2.0" }
bindings_header = "bindings.h"
bindings_module = "camera"

# A standalone cargo project: not a member of the rusty_esp_image workspace
# (cargo needs this table, a glob in workspace.exclude does not match).
[workspace]
